# =====================================================================
#  DB 접속 정보 — 시연하는 노트북(서버)의 MySQL 정보로 수정해서 사용
#  (실행 시 -Ddb.password=xxx 처럼 JVM 옵션을 주면 이 파일 값보다 우선 적용)
#  ※ 클라이언트(메이커/서포터 노트북)는 DB에 직접 접속하지 않으므로 이 파일을 쓰지 않음
# =====================================================================
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/crowdfunding?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
db.username=root
db.password=your_password
