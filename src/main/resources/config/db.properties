# ---------------------------------------------------------------
# DB 접속 정보 (3주차 강의 PooledDataSource 와 같은 키 이름)
#  - 각자 자기 MySQL 계정에 맞게 DB_USER / DB_PWD 만 수정
#  - 파일을 고치지 않고 실행 옵션으로 덮어쓰기도 가능: -DDB_PWD=xxxx
#  - 진짜 비밀번호를 넣은 채로 깃허브에 올리지 않기!
# ---------------------------------------------------------------
DRIVER_CLASS=com.mysql.cj.jdbc.Driver
DB_USER=root
DB_CONNECTION_URL=jdbc:mysql://localhost:3306/crowdfunding?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
DB_PWD=CHANGE_ME
